[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mangoleaf"
version = "0.1.0"
description = "Reproducible MangoLeafBD v1 acquisition and shared stratified partitions (Issue #1)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Diego Alvarez", email = "diegoanthony.ac1812@gmail.com" }]
dependencies = [
    "Pillow>=10,<12",
    "requests>=2.31,<3",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
loaders = ["torch==2.8.0", "torchvision==0.23.0"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "black>=24",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py310"]
